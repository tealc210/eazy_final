---
# tasks file for pgadmin_role
- name: Create a project directory
  ansible.builtin.file:
    path: /tmp/pgadmin
    state: directory
    mode: '0755'

- name: PgAdmin configuration file
  ansible.builtin.template:
    src: servers.json.j2
    dest: "{{ CONF_FILE_REMOTE_PATH }}"

- name: Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /tmp/pgadmin/docker-compose.yml

- name: Create and start services
  community.docker.docker_compose_v2:
    project_src: /tmp/pgadmin
    recreate: "always"
  register: output
  ignore_errors: true
- debug:
    var: output

- name: Remove compose file
  ansible.builtin.file:
    path: /tmp/pgadmin/docker-compose.yml
    state: absent

- name: Deployment failure
  ansible.builtin.fail:
    msg: "Services deployment failed."
  when: output.failed != false
