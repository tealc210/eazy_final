---
# tasks file for pgadmin_role
- name: PgAdmin configuration file
  ansible.builtin.template:
    src: server.json.j2
    dest: /tmp/server.json

- name: Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /tmp/docker-compose.yml

- name: Create and start services
  docker_compose:
    project_src: /tmp
  register: output
- debug:
    var: output
